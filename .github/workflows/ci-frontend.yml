name: CI Frontend

on:
  push:
    branches: [main, dev]
    paths: ["bitlog-frontend/**"]
  pull_request:
    paths: ["bitlog-frontend/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitlog-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: bitlog-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:ci
