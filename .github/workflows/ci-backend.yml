name: CI Backend

on:
  push:
    branches: [main, dev]
    paths: ["bitlog-backend/**"]
  pull_request:
    paths: ["bitlog-backend/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitlog-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - run: mvn -B verify
