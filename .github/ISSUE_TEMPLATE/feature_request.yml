name: 功能建议
description: 提议新功能、架构或体验改进
title: "feat: "
labels: [enhancement]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 后端
        - 前端（Web）
        - 桌面端（Markwright）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请说明目前遇到的问题或限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望行为，以及可能影响的接口、模块或交互方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如有，请说明考虑过的替代方案。
