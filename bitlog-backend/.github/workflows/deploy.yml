name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -q

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hleidev/bitlog-backend:latest
            ghcr.io/hleidev/bitlog-backend:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            cd /opt/bitlog
            PREV_VERSION=$(cat .version 2>/dev/null || echo "latest")

            APP_VERSION=$GITHUB_SHA docker compose pull app
            APP_VERSION=$GITHUB_SHA docker compose up -d app

            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "App is healthy"
                echo "$GITHUB_SHA" > .version
                docker image prune -f
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 3
            done

            echo "Health check failed, rolling back to $PREV_VERSION..."
            APP_VERSION=$PREV_VERSION docker compose up -d app
            exit 1
