name: 缺陷报告
description: 报告可以稳定复现的问题
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 准备……
        2. 请求……
        3. 出现……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: JDK、数据库和操作系统版本。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附上脱敏后的日志、请求参数或最小复现。
