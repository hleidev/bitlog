server:
  port: 8001

spring:
  application:
    name: bytelogs-user-service  # Nacos 注册名，与 UserClient @FeignClient(name=) 保持一致
  profiles:
    active: dev  # 默认激活 dev，生产环境通过启动参数覆盖
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  flyway:
    enabled: true
    baseline-on-migrate: true   # 数据库已存在表时不报错，直接标记为基线

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

logging:
  level:
    top.harrylei.community: debug

database:
  name: bytelogs_user

jwt:
  issuer: bytelogs
  secret: ***REMOVED***
  default-expire: 1d
  keep-login-expire: 3d

user:
  default-password: bytelogs@123

app:
  exception:
    print-stack-trace: true
