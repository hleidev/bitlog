server:
  port: 9003

spring:
  application:
    name: bitlog-file-service
  config:
    import:
      - nacos:bitlog-shared.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

storage:
  endpoint: http://minio:9000
  access-key: admin
  secret-key: ***REMOVED***
  bucket: media
  public-url: http://localhost/files
  presign-expire-minutes: 5

app:
  exception:
    print-stack-trace: true
