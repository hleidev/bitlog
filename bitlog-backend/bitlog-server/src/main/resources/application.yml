spring:
  application:
    name: bitlog-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

jwt:
  issuer: bitlog
  access-token-expire: 15m
  refresh-token-expire: 30d

security:
  additional-whitelist:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/article/*
    - /api/v1/tag
    - /api/v1/category

user:
  default-password: bitlog@123

redis:
  health:
    check:
      enabled: true
      interval: 30000
