spring:
  application:
    name: bitlog-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: 5000ms
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            # client-id 会出现在浏览器的授权 URL 里，本就是公开信息，无需加密
            client-id: 204351845477-7id29gi9iev8o32d95ufhdhbksuot5fm.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

jwt:
  issuer: bitlog
  access-token-expire: 15m
  refresh-token-expire: 30d

mail:
  api-url: https://api.resend.com/emails
  api-key: ${MAIL_API_KEY}
  from: noreply@mail.harrylei.top
  from-name: BitLog
  site-url: bitlog.harrylei.top

bitlog:
  comment:
    rate-limit:
      min-interval: 15s
      window: 1h
      max-per-window: 10

security:
  # 单星只匹配一层路径段，是刻意的：它让写接口（如 /article/{id}/publish、
  # /article/{id}/comments）落在白名单之外，由过滤器强制校验 JWT，
  # 注解仅作第二道防线。改成 ** 会让这些写接口只剩注解一层保护。
  additional-whitelist:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/auth/register/code
    - /api/v1/auth/password/reset
    - /api/v1/auth/password/reset/code
    - /api/v1/article/*
    - /api/v1/article/*/comments/page
    - /api/v1/tag
    - /api/v1/category
  allowed-origins:
    - http://localhost:5173

redis:
  health:
    check:
      enabled: true
      interval: 30000
