spring:
  # 本地开发的环境变量来源。Spring Boot 2.4+ 的原生能力，不需要 direnv，也不需要第三方库。
  # 真实 OS 环境变量优先级更高，生产由 docker-compose 直接注入、镜像里没有 .env，optional: 保证跳过。
  # 相对路径按进程工作目录解析，所以本地必须从 bitlog-backend/ 启动。
  # 不要加 ../.env 兜底：那是仓库根的生产密钥文件，键名与这份大量重叠，会把生产密钥灌进 dev。
  config:
    import: optional:file:.env[.properties]
  # 默认档。把 SPRING_PROFILES_ACTIVE 放进 .env 是无效的：作为 properties 导入后键名就是字面的
  # SPRING_PROFILES_ACTIVE，只有 OS 环境变量才会被映射成 spring.profiles.active。生产在
  # docker-compose 里以真环境变量覆盖此处为 prod。
  profiles:
    active: dev
  application:
    name: bitlog-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: 5000ms
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            # client-id 会出现在浏览器的授权 URL 里，本就是公开信息，无需加密
            client-id: 204351845477-7id29gi9iev8o32d95ufhdhbksuot5fm.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

jwt:
  issuer: bitlog
  access-token-expire: 15m
  refresh-token-expire: 30d

mail:
  api-url: https://api.resend.com/emails
  api-key: ${MAIL_API_KEY}
  from: noreply@mail.harrylei.top

bitlog:
  site:
    name: BitLog
    url: https://bitlog.harrylei.top
  comment:
    rate-limit:
      min-interval: 15s
      window: 1h
      max-per-window: 10

security:
  # 单星只匹配一层路径段，是刻意的：它让写接口（如 /article/{id}/publish、
  # /article/{id}/comments）落在白名单之外，由过滤器强制校验 JWT，
  # 注解仅作第二道防线。改成 ** 会让这些写接口只剩注解一层保护。
  additional-whitelist:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/auth/register/code
    - /api/v1/auth/password/reset
    - /api/v1/auth/password/reset/code
    - /api/v1/article/*
    - /api/v1/article/*/comments/page
    - /api/v1/tag
    - /api/v1/category
    - /api/v1/links
  allowed-origins:
    - http://localhost:5173
