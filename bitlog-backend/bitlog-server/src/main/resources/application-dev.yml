    url: jdbc:mysql://localhost:3306/bitlog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ENC(REMOVED)
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 12
      password: ENC(REMOVED)
