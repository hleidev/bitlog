    print-stack-trace: true

storage:
  endpoint: http://localhost:19000
  access-key: admin
  secret-key: ENC(REMOVED)
  bucket: bitlog
  public-url: http://localhost:19000/bitlog

bitlog:
  ai:
    providers:
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ENC(REMOVED)
        timeout: 30s
    capabilities:
      text-json:
        provider: qwen
        model: qwen3.6-flash
        extra-params:
          enable_thinking: false
          response_format:
            type: json_object
