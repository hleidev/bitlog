server:
  port: 12301

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bitlog
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 12
      password: ${REDIS_PASSWORD}
  flyway:
    clean-disabled: true

jwt:
  secret: ${JWT_SECRET}

cookie:
  secure: false

oauth2:
  redirect-uri: http://localhost:5173/auth/callback
  bind-redirect-uri: http://localhost:5173/admin/profile

app:
  exception:
    print-stack-trace: true

storage:
  endpoint: http://localhost:19000
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: bitlog
  public-url: http://localhost:19000/bitlog

bitlog:
  ai:
    providers:
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${QWEN_API_KEY}
        timeout: 30s
    capabilities:
      text-json:
        provider: qwen
        model: qwen3.6-flash
        extra-params:
          enable_thinking: false
          response_format:
            type: json_object
