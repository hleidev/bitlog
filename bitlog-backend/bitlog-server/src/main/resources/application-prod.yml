server:
  port: 8080
  forward-headers-strategy: FRAMEWORK

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bitlog
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD}
  flyway:
    clean-disabled: true

jwt:
  secret: ${JWT_SECRET}

storage:
  endpoint: http://minio:9000
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: bitlog
  public-url: https://api.harrylei.top/assets

cookie:
  secure: true

oauth2:
  redirect-uri: https://bitlog.harrylei.top/auth/callback
  bind-redirect-uri: https://bitlog.harrylei.top/admin/profile

security:
  allowed-origins:
    - https://bitlog.harrylei.top

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  exception:
    print-stack-trace: false

bitlog:
  ai:
    providers:
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${QWEN_API_KEY}
        timeout: 30s
    capabilities:
      text-json:
        provider: qwen
        model: qwen3.6-flash
        extra-params:
          enable_thinking: false
          response_format:
            type: json_object

cloudflare:
  deploy-hook:
    url: ${CLOUDFLARE_DEPLOY_HOOK_URL}
