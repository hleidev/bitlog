server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bitlog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ENC(REMOVED)
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ENC(REMOVED)
  flyway:
    clean-disabled: true

jwt:
  secret: ENC(REMOVED)

storage:
  endpoint: http://minio:9000
  access-key: admin
  secret-key: ENC(REMOVED)
  bucket: bitlog
  public-url: https://api.harrylei.top/assets

cookie:
  secure: true

security:
  allowed-origins:
    - https://bitlog.harrylei.top

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  exception:
    print-stack-trace: false

bitlog:
  ai:
    providers:
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ENC(REMOVED)
        timeout: 30s
    capabilities:
      text-json:
        provider: qwen
        model: qwen3.6-flash
        extra-params:
          enable_thinking: false
          response_format:
            type: json_object
