server:
  port: 9000

spring:
  application:
    name: bitlog-gateway
  config:
    import:
      - nacos:bitlog-shared.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # 用户认证路由
            - id: user-auth
              uri: lb://bitlog-user-service
              predicates:
                - Path=/api/v1/auth/**

            # 用户业务路由（需要鉴权）
            - id: user-service
              uri: lb://bitlog-user-service
              predicates:
                - Path=/api/v1/user/**

            # 管理员路由（需要鉴权）
            - id: admin-service
              uri: lb://bitlog-user-service
              predicates:
                - Path=/api/v1/admin/**

            # 文章服务路由
            - id: article-service
              uri: lb://bitlog-article-service
              predicates:
                - Path=/api/v1/article/**,/api/v1/tag/**,/api/v1/category/**

            # 文件服务路由
            - id: file-service
              uri: lb://bitlog-file-service
              predicates:
                - Path=/api/v1/file/**

jwt:
  issuer: bitlog

gateway:
  auth:
    whitelist:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/article/page
      - /api/v1/tag
      - /api/v1/category

