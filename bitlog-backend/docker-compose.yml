services:

  user-service:
    build:
      context: bitlog-user-service
      dockerfile: Dockerfile
    image: bitlog-user-service:latest
    container_name: bitlog-user-service
    environment:
      # Nacos（服务注册 + 配置中心）
      NACOS_SERVER_ADDR: nacos:8848
      # 数据库
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bitlog_user?useUnicode=true&allowPublicKeyRetrieval=true&autoReconnect=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 12
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9001/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - infra-network

  article-service:
    build:
      context: bitlog-article-service
      dockerfile: Dockerfile
    image: bitlog-article-service:latest
    container_name: bitlog-article-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bitlog_article?useUnicode=true&allowPublicKeyRetrieval=true&autoReconnect=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 13
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9002/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - infra-network

  file-service:
    build:
      context: bitlog-file-service
      dockerfile: Dockerfile
    image: bitlog-file-service:latest
    container_name: bitlog-file-service
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9003/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - infra-network

  gateway:
    build:
      context: bitlog-gateway
      dockerfile: Dockerfile
    image: bitlog-gateway:latest
    container_name: bitlog-gateway
    ports:
      - "9000:9000"
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 12
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      user-service:
        condition: service_healthy
      article-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infra-network

# 接入基础设施网络
networks:
  infra-network:
    external: true
    name: infrastructure_infra-network
